# Cloudflare Workers 배포 설정.
# 배포 전 D1 데이터베이스를 만들고 database_id를 채워 넣으세요. (아래 안내 참고)

name = "cp-manager"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 정적 자산(프런트엔드) — public/ 폴더를 그대로 서빙
[assets]
directory = "./public"
binding = "ASSETS"

# D1 데이터베이스 바인딩
# 1) 터미널에서: npx wrangler d1 create cp-manager-db
# 2) 출력된 database_id를 아래에 붙여넣기
[[d1_databases]]
binding = "DB"
database_name = "cp-manager-db"
database_id = "PUT-YOUR-D1-DATABASE-ID-HERE"

# 관리자 보호키(선택): 대시보드 Variables에서 CP_ADMIN_KEY 설정 가능
# [vars]
# CP_ADMIN_KEY = ""
