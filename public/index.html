<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ee735a" />
  <title>CP 매니저</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ee735a'/%3E%3Cstop offset='1' stop-color='%23e7a84d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23d95b44' stroke-width='4'/%3E%3Ctext x='50' y='50' text-anchor='middle' dominant-baseline='central' font-family='Arial,sans-serif' font-size='40' font-weight='bold' fill='%23fff'%3ECP%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="app-header">
    <h1><span class="cp-coin" aria-hidden="true">CP</span> CP 매니저</h1>
    <span id="teacherBadge"></span>
    <span class="spacer"></span>
    <button class="header-btn primary" id="btnQuickLesson" title="선택한 학생의 수업 기록 추가">📖 수업 기록</button>
    <button class="header-btn primary" id="btnQuickWord" title="선택한 학생의 단어시험 입력">✏️ 단어시험</button>
    <span class="header-sep"></span>
    <button class="header-btn" id="btnWordWidget" title="단어 점수 간편 입력기">📝 단어 위젯</button>
    <button class="header-btn" id="btnRemote" title="수업 참여 리모콘">🎮 참여 리모콘</button>
    <button class="header-btn" id="btnRanking">🏆 랭킹</button>
    <button class="header-btn" id="btnBackup">💾 백업</button>
    <button class="header-btn" id="btnChangeTeacher" style="display:none">↩ 강사 변경</button>
  </header>

  <main class="container" id="app">
    <div class="loading-box"><div class="spinner"></div>불러오는 중...</div>
  </main>

  <div id="modal-root"></div>
  <div id="toast-area"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
