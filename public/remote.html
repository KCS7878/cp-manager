<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수업 참여 리모콘</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .remote-card { border:1px solid var(--border); border-radius:12px; padding:0.7rem; background:#fff; display:flex; align-items:center; gap:0.6rem; margin-bottom:0.5rem; flex-wrap:wrap; }
    .remote-card .nm { flex:1; font-weight:700; min-width:90px; }
    .stacks { display:flex; gap:0.25rem; }
    .stack-dot { width:22px; height:22px; border-radius:50%; background:#eee5d5; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; color:#b7a582; }
    .stack-dot.on { background:var(--coral); color:#fff; }
    .stack-dot.bonus { background:var(--sage); color:#fff; }
  </style>
</head>
<body>
  <div class="popup-page">
    <h2 style="margin-top:0">🎮 수업 참여 리모콘</h2>
    <div class="form-grid">
      <div class="field"><label>분반</label><select id="classSel"></select></div>
      <div class="field"><label>수업일</label><input type="date" id="dateInp" /></div>
    </div>
    <p class="muted">참여 +1 / 정정 -1. 한 수업일 최대 3회. 3회 달성 시 보너스 CP, 2회로 정정 시 회수됩니다.</p>
    <div id="list"></div>
    <div id="toast-area"></div>
  </div>
  <script type="module">
    import { api } from '/js/api.js';
    import { h, clear, toast } from '/js/ui.js';

    const params = new URLSearchParams(location.search);
    const teacherId = Number(params.get('teacher_id'));
    const classSel = document.getElementById('classSel');
    const dateInp = document.getElementById('dateInp');
    const listEl = document.getElementById('list');
    dateInp.value = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);

    let rules = null;

    async function loadClasses() {
      const { classes } = await api.get(`/api/teachers/${teacherId}/classes`);
      clear(classSel);
      if (!classes.length) { classSel.appendChild(h('option', { value: '' }, '분반 없음')); return; }
      for (const c of classes) classSel.appendChild(h('option', { value: c }, c));
      await loadRoster();
    }

    async function loadRoster() {
      const cls = classSel.value;
      if (!cls) { listEl.innerHTML = '<div class="empty">분반이 없습니다. 메인에서 학생에 분반명을 지정하세요.</div>'; return; }
      clear(listEl);
      listEl.innerHTML = '<div class="loading-box">불러오는 중...</div>';
      try {
        const { students } = await api.get('/api/participation', { query: { teacher_id: teacherId, class_name: cls, lesson_date: dateInp.value } });
        paint(students);
      } catch (e) { listEl.innerHTML = ''; listEl.appendChild(h('div', { class: 'error-box' }, e.message)); }
    }

    // 학생별 로컬 상태 + 카드 DOM 캐시 (즉각 반응용)
    const roster = new Map(); // studentId -> { s, cardEl, dotsEl, labelEl, pending(동기화 대기 delta 큐) }

    function paint(students) {
      clear(listEl);
      roster.clear();
      if (!students.length) { listEl.appendChild(h('div', { class: 'empty' }, '해당 분반 학생이 없습니다.')); return; }
      for (const s of students) {
        const entry = renderCard(s);
        roster.set(s.id, entry);
        listEl.appendChild(entry.cardEl);
      }
    }

    function renderCard(s) {
      const dotsEl = h('div', { class: 'stacks' });
      const labelEl = h('span', { class: 'muted' });
      const cardEl = h('div', { class: 'remote-card' },
        h('div', { class: 'nm wrap-anywhere' }, s.name),
        dotsEl,
        labelEl,
        h('button', { class: 'btn sm', onClick: () => adjust(s.id, 1) }, '참여 +1'),
        h('button', { class: 'btn sm secondary', onClick: () => adjust(s.id, -1) }, '정정 -1'));
      const entry = { s: { ...s }, cardEl, dotsEl, labelEl, syncing: false, queued: 0 };
      drawCard(entry);
      return entry;
    }

    // 로컬 상태를 DOM에 즉시 그린다 (서버 응답 기다리지 않음)
    function drawCard(entry) {
      const { s } = entry;
      clear(entry.dotsEl);
      for (let i = 1; i <= 3; i++) {
        entry.dotsEl.appendChild(h('div', { class: 'stack-dot' + (s.stack >= i ? (i === 3 ? ' bonus' : ' on') : '') }, i === 3 ? '★' : i));
      }
      entry.labelEl.textContent = `${s.stack}회${s.bonus_given ? ' (+보너스)' : ''}`;
      // 깜빡 효과로 즉각 반응 피드백
      entry.cardEl.style.transition = 'none';
      entry.cardEl.style.background = '#fff3ee';
      requestAnimationFrame(() => { entry.cardEl.style.transition = 'background 0.4s'; entry.cardEl.style.background = '#fff'; });
    }

    // 즉각 반응: 로컬 상태를 바로 바꾸고 DOM 갱신, 서버는 뒤에서 순차 동기화
    function adjust(studentId, delta) {
      const entry = roster.get(studentId);
      if (!entry) return;
      const s = entry.s;
      // 로컬 즉시 반영 (0~3 범위, 3스택 보너스 로컬 추정)
      let newStack = s.stack + delta;
      if (newStack < 0) newStack = 0;
      if (newStack > 3) newStack = 3;
      s.stack = newStack;
      s.bonus_given = newStack >= 3 ? 1 : 0;
      drawCard(entry);
      // 서버 동기화 큐에 추가 (순서 보장)
      entry.queued += delta;
      syncEntry(entry, studentId);
    }

    // 큐에 쌓인 delta를 순차 전송 (버튼을 연타해도 UI는 즉각, 서버는 뒤에서 따라옴)
    async function syncEntry(entry, studentId) {
      if (entry.syncing) return;
      entry.syncing = true;
      try {
        while (entry.queued !== 0) {
          const dir = entry.queued > 0 ? 1 : -1;
          entry.queued -= dir;
          try {
            await api.post(`/api/students/${studentId}/participation`, { lesson_date: dateInp.value, delta: dir });
          } catch (e) {
            // 전송 실패 시 조용히 1회 재시도 후 포기 (UI는 유지, 다음 새로고침 때 정합)
            try { await api.post(`/api/students/${studentId}/participation`, { lesson_date: dateInp.value, delta: dir }); }
            catch { toast('일부 반영이 지연됐습니다. 잠시 후 자동 동기화됩니다.', 'info'); }
          }
        }
        // 메인 화면에 반영 신호 (뒤에서)
        if (window.opener && !window.opener.closed) {
          window.opener.dispatchEvent(new CustomEvent('cp:data-changed', { detail: { studentId } }));
        }
      } finally {
        entry.syncing = false;
      }
    }

    classSel.onchange = loadRoster;
    dateInp.onchange = loadRoster;
    loadClasses().catch((e) => toast('로딩 실패: ' + e.message, 'error'));
  </script>
</body>
</html>
